version: "3.8"

services:
  mysql:
    image: mysql:8.4
    container_name: mysql-container-jdbc
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: Neueda@123
      MYSQL_DATABASE: company

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    networks:
      - springboot-network-jdbc

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pNeueda@123"]
      interval: 10s
      timeout: 5s
      retries: 10

  springboot-app:
    build: .
    container_name: springboot-container-jdbc
    restart: always

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:mysql://mysql:3306/company
      DB_USER: root
      DB_PASS: Neueda@123

    ports:
      - "8082:8082"

    networks:
      - springboot-network-jdbc

volumes:
  mysql-data:

networks:
  springboot-network-jdbc:
    driver: bridge