<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Employee Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        .container {
            margin-top: 20px;
        }

        .card-custom {
            margin-bottom: 20px;
        }

        .action-buttons button {
            margin-right: 5px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1 class="text-center mb-4">Employee Management</h1>

    <!-- Employee Form -->
    <div class="card card-custom">
        <div class="card-header">
            <h5>Add Employee</h5>
        </div>

        <div class="card-body">

            <form id="employeeForm">

                <div class="mb-3">
                    <label class="form-label">Employee Name</label>
                    <input type="text" class="form-control" id="name" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Department</label>
                    <input type="text" class="form-control" id="department" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Salary</label>
                    <input type="number" class="form-control" id="salary" required>
                </div>

                <button type="submit" class="btn btn-primary">
                    Add Employee
                </button>

            </form>

        </div>
    </div>

    <!-- Employee Table -->

    <div class="card">

        <div class="card-header">
            <h5>Employee List</h5>
        </div>

        <div class="card-body">

            <table class="table table-bordered">

                <thead>

                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Department</th>
                    <th>Salary</th>
                    <th>Actions</th>
                </tr>

                </thead>

                <tbody id="employeeTableBody">

                </tbody>

            </table>

        </div>

    </div>

</div>

<script>

    const apiUrl = "localhost:8082/api/v1/employee/";
    let editingEmployeeId = null;

    function fetchEmployees() {

        fetch(apiUrl)
            .then(res => res.json())
            .then(data => {

                const tableBody = document.getElementById("employeeTableBody");
                tableBody.innerHTML = "";

                data.forEach(employee => {

                    const row = document.createElement("tr");

                    row.innerHTML = `
                        <td>${employee.id}</td>
                        <td>${employee.name}</td>
                        <td>${employee.department}</td>
                        <td>${employee.salary}</td>

                        <td class="action-buttons">

                            <button
                                class="btn btn-warning btn-sm"
                                onclick="editEmployee(${employee.id},'${employee.name}','${employee.department}',${employee.salary})">

                                Edit

                            </button>

                            <button
                                class="btn btn-danger btn-sm"
                                onclick="deleteEmployee(${employee.id})">

                                Delete

                            </button>

                        </td>
                    `;

                    tableBody.appendChild(row);

                });

            })
            .catch(err => console.error(err));

    }

    document.getElementById("employeeForm")
        .addEventListener("submit", function (e) {

            e.preventDefault();

            const employee = {

                name: document.getElementById("name").value,
                department: document.getElementById("department").value,
                salary: parseFloat(document.getElementById("salary").value)

            };

            const method = editingEmployeeId ? "PUT" : "POST";
            const url = editingEmployeeId
                ? apiUrl + editingEmployeeId
                : apiUrl;

            fetch(url, {

                method: method,

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(employee)

            })

            .then(res => res.json())

            .then(() => {

                alert(editingEmployeeId
                    ? "Employee Updated Successfully"
                    : "Employee Added Successfully");

                fetchEmployees();

                document.getElementById("employeeForm").reset();

                editingEmployeeId = null;

                document.querySelector("button[type='submit']").innerText = "Add Employee";

            })

            .catch(err => console.error(err));

        });

    function editEmployee(id, name, department, salary) {

        editingEmployeeId = id;

        document.getElementById("name").value = name;
        document.getElementById("department").value = department;
        document.getElementById("salary").value = salary;

        document.querySelector("button[type='submit']").innerText = "Update Employee";

    }

    function deleteEmployee(id) {

        if (confirm("Delete this employee?")) {

            fetch(apiUrl + id, {

                method: "DELETE"

            })

            .then(() => {

                alert("Employee Deleted Successfully");

                fetchEmployees();

            })

            .catch(err => console.error(err));

        }

    }

    fetchEmployees();

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
